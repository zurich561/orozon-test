<!DOCTYPE html>
<html lang="de" th:replace="fragments/layout :: layout(~{::title}, ~{::section})">
<head>
    <title th:text="${product.title}">Produkt</title>
</head>
<body>
<section>
    <article class="result-card">
        <h2 th:text="${product.title}">Titel</h2>
        <p><strong>Autor:</strong> <span th:text="${product.author}"></span></p>
        <p><strong>ISBN:</strong> <span th:text="${product.isbn}"></span></p>
        <p><strong>Format:</strong> <span th:text="${product.format}"></span></p>
        <p><strong>Sprache:</strong> <span th:text="${product.language}"></span></p>
        <p><strong>Preis:</strong> <span th:text="${#numbers.formatDecimal(product.price,1,2)}"></span> €</p>
        <p th:text="${product.description}"></p>
        <form method="post" data-cart-form="true">
            <input type="hidden" name="productId" th:value="${product.id}">
            <label for="detailQty">Menge</label>
            <input id="detailQty" name="quantity" type="number" value="1" min="1">
            <button type="submit">In den Warenkorb</button>
        </form>
    </article>
    <section aria-labelledby="similarHeading">
        <h3 id="similarHeading">Ähnliche Titel</h3>
        <ul>
            <li th:each="item : ${similar}"><a th:href="@{'/products/' + ${item.id}}" th:text="${item.title}"></a></li>
        </ul>
    </section>
    <section aria-labelledby="alsoHeading">
        <h3 id="alsoHeading">Kundinnen kauften auch</h3>
        <ul>
            <li th:each="item : ${alsoBought}"><a th:href="@{'/products/' + ${item.id}}" th:text="${item.title}"></a></li>
        </ul>
    </section>
</section>
<script>
    const form = document.querySelector('form[data-cart-form]');
    if (form) {
        form.addEventListener('submit', function (event) {
            event.preventDefault();
            const formData = new FormData(form);
            const payload = {
                productId: Number(formData.get('productId')),
                quantity: Number(formData.get('quantity'))
            };
            fetch('/api/cart/items', {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            }).then(res => {
                if (res.ok) {
                    alert('Produkt im Warenkorb.');
                } else if (res.status === 401) {
                    window.location.href = '/login';
                } else {
                    res.json().then(data => alert(data.error || 'Fehler'));
                }
            });
        });
    }
</script>
</body>
</html>
