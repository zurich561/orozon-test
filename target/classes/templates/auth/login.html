<!DOCTYPE html>
<html lang="de" th:replace="fragments/layout :: layout(~{::title}, ~{::section})">
<head>
    <title>Anmeldung</title>
</head>
<body>
<section>
    <h2>Anmeldung</h2>
    <div th:if="${param.error}">
        <p class="alert" role="alert">Anmeldung fehlgeschlagen. Bitte prüfen Sie Ihre Daten.</p>
    </div>
    <div th:if="${param.logout}">
        <p class="alert" role="status">Sie wurden abgemeldet.</p>
    </div>
    <div th:if="${message}">
        <p class="alert" role="status" th:text="${message}"></p>
    </div>
    <form method="post" th:action="@{/login}" aria-label="Anmeldedaten">
        <label for="username">Benutzername</label>
        <input id="username" name="username" required autofocus>
        <label for="password">Passwort</label>
        <input id="password" name="password" type="password" required>
        <button type="submit">Anmelden</button>
    </form>
    <p>Noch kein Konto? <a th:href="@{/register}">Jetzt registrieren</a></p>
    <p><a th:href="@{/auth/password-reset}">Passwort zurücksetzen</a></p>
</section>
</body>
</html>
