<!DOCTYPE html>
<html lang="de" th:replace="fragments/layout :: layout(~{::title}, ~{::section})">
<head>
    <title>Passwort zurücksetzen</title>
</head>
<body>
<section>
    <h2>Passwort zurücksetzen</h2>
    <form th:action="@{/auth/password-reset}" th:object="${resetRequest}" method="post">
        <label for="email">E-Mail</label>
        <input id="email" type="email" th:field="*{email}" required>
        <label for="newPassword">Neues Passwort</label>
        <input id="newPassword" type="password" th:field="*{newPassword}" minlength="8" required>
        <button type="submit">Passwort setzen</button>
    </form>
</section>
</body>
</html>
