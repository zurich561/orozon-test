<!DOCTYPE html>
<html lang="de" th:replace="fragments/layout :: layout(~{::title}, ~{::section})">
<head>
    <title>Produktsuche</title>
</head>
<body>
<section class="amzn-section amzn-hero">
    <h2>Finden Sie Ihr nächstes Lieblingsbuch</h2>
    <p>Tauchen Sie in kuratierte Empfehlungen, Top-Seller und personalisierte Treffer ein – fast wie bei Amazon.</p>
</section>
<section class="amzn-section search-layout" aria-label="Produktsuche">
    <form class="search-filters-bar" role="search" method="get" th:action="@{/search}">
        <div class="filter-input filter-search">
            <label for="searchTerm" class="sr-only">Suchbegriff</label>
            <div class="autocomplete-wrapper">
                <input id="searchTerm" name="q" type="search" th:value="${query}" aria-autocomplete="list"
                       aria-controls="searchSuggestions" aria-haspopup="listbox" placeholder="Autor, Titel, ISBN">
                <ul id="searchSuggestions" class="autocomplete-list hidden" role="listbox"></ul>
            </div>
        </div>
        <div class="filter-input">
            <label for="category">Kategorie</label>
            <select id="category" name="category">
                <option value="">Alle</option>
                <option th:each="category : ${categories}"
                        th:value="${category}" th:text="${category}" th:selected="${category} == ${param.category}"></option>
            </select>
        </div>
        <div class="filter-input">
            <label for="author">Autor</label>
            <input id="author" name="author" type="text" th:value="${param.author}">
        </div>
        <div class="filter-input">
            <label for="language">Sprache</label>
            <input id="language" name="language" type="text" th:value="${param.language}">
        </div>
        <div class="filter-input">
            <label for="format">Format</label>
            <select id="format" name="format">
                <option value="">Alle</option>
                <option th:each="fmt : ${formats}"
                        th:value="${fmt}" th:text="${fmt}" th:selected="${fmt} == ${param.format}"></option>
            </select>
        </div>
        <div class="filter-input filter-price">
            <label for="minPrice">Preis von</label>
            <input id="minPrice" name="minPrice" type="number" step="0.01" min="0" th:value="${param.minPrice}">
            <label for="maxPrice">bis</label>
            <input id="maxPrice" name="maxPrice" type="number" step="0.01" min="0" th:value="${param.maxPrice}">
        </div>
        <button type="submit" class="button-primary filter-submit">Filtern</button>
    </form>
    <div class="search-results" role="region" aria-live="polite" aria-atomic="true">
        <div class="search-results-header">
            <h3>Suchergebnisse</h3>
            <p th:text="${totalResults} + ' Ergebnisse gefunden'">0 Ergebnisse gefunden</p>
        </div>
        <div class="result-list" role="list">
            <article class="result-card" role="listitem" th:each="product : ${products}"
                     th:attr="data-product-id=${product.id},
                              data-product-title=${product.title},
                              data-product-price=${product.price},
                              data-product-cover=${product.coverImageUrl},
                              data-product-author=${product.author}">
                <div class="result-card-media">
                    <img th:src="${product.coverImageUrl}" th:alt="${'Cover von ' + product.title}" loading="lazy">
                    <button class="favorite-button" type="button" th:attr="data-favorite-id=${product.id}">
                        <span aria-hidden="true">❤</span>
                        <span class="sr-only">Zu Favoriten hinzufügen</span>
                    </button>
                </div>
                <div class="result-card-body">
                    <span class="badge" th:text="${product.format}">Format</span>
                    <h3><a th:href="@{'/products/' + ${product.id}}" th:text="${product.title}"></a></h3>
                    <p><strong>Autor:</strong> <span th:text="${product.author}"></span></p>
                    <p><strong>ISBN:</strong> <span th:text="${product.isbn}"></span></p>
                    <p class="amzn-price"><span th:text="${#numbers.formatDecimal(product.price,1,2)}"></span> €</p>
                    <p class="result-description" th:text="${product.description}"></p>
                    <div class="add-to-cart-form">
                        <div class="quantity-row">
                            <label th:for="${'qty-' + product.id}">Menge</label>
                            <input class="qty-input" th:id="${'qty-' + product.id}" type="number" min="1" value="1">
                        </div>
                        <button type="button" class="button-primary" data-add-to-cart>
                            In den Warenkorb
                        </button>
                    </div>
                </div>
            </article>
        </div>
    </div>
</section>
</body>
</html>
